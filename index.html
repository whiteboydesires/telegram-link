<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>18+ Private Telegram Channel</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: #0f172a;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        background: #1e293b;
        border-radius: 20px;
        padding: 32px 24px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.5),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
        border: 1px solid #334155;
      }

      .badge {
        display: inline-block;
        background-color: #dc2626;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 50px;
        margin-bottom: 16px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .telegram-icon {
        width: 72px;
        height: 72px;
        background: #24a1de;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
        box-shadow: 0 0 20px rgba(36, 161, 222, 0.4);
      }

      .telegram-icon svg {
        width: 38px;
        height: 38px;
        fill: #ffffff;
        margin-right: 3px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #f8fafc;
      }

      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 24px;
      }

      .btn-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        padding: 16px 24px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(0, 136, 204, 0.4);
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .footer-note {
        font-size: 12px;
        color: #64748b;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>

</html>
